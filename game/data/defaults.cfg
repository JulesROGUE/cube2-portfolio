// defaults.cfg — réglages par défaut de la visite portfolio (Cube 2 allégé).
// Exécuté quand aucune configuration sauvegardée n'existe.

name "invite"

invmouse 0
sensitivity 3
fov 100
gamma 100
fullbrightmodels 80

consize 5
miniconsize 5
miniconwidth 40
fullconsize 75
miniconfilter 0x300
confilter (&~ 0x2FFF $miniconfilter)
fullconfilter 0xFFFF

// Déplacements : ZQSD (AZERTY) et WASD (QWERTY) + flèches
bind W forward
bind A left
bind S backward
bind D right
bind Z forward
bind Q left
bind UP "forward"
bind DOWN "backward"
bind RIGHT "right"
bind LEFT "left"

bind SPACE "jump"
bind MOUSE2 "jump"

bind TAB "showscores"
bind T "saycommand"
bind RETURN "saycommand"
bind BACKQUOTE "saycommand /"
bind SLASH "saycommand /"

bind F1 "showgui aide"
bind H "showgui aide"
bind F11 "toggleconsole"
bind C "thirdperson (! $thirdperson)"

// Pas d'armes : la visite est pacifique.
hudgun 0

showfps 0
hudscore 0
gameclock 0
