// defaults.cfg — réglages par défaut de la visite portfolio (Cube 2 allégé).
// Exécuté quand aucune configuration sauvegardée n'existe.

name "invite"

invmouse 0
sensitivity 3
fov 100
gamma 100
fullbrightmodels 30

consize 5
miniconsize 5
miniconwidth 40
fullconsize 75
miniconfilter 0x300
confilter (&~ 0x2FFF $miniconfilter)
fullconfilter 0xFFFF

// Déplacements : ZQSD (AZERTY) et WASD (QWERTY) + flèches
bind W forward
bind A left
bind S backward
bind D right
bind Z forward
bind Q left
bind UP "forward"
bind DOWN "backward"
bind RIGHT "right"
bind LEFT "left"

bind SPACE "jump"
bind MOUSE2 "jump"

bind TAB "showscores"
bind T "saycommand"
bind RETURN "saycommand"
bind BACKQUOTE "saycommand /"
bind SLASH "saycommand /"

bind MOUSE1 "attack"
bind MOUSE3 "weapon"
bind MOUSE4 [ weapon 2 3 5 4 1 6 0 ]
bind MOUSE5 [ weapon 4 1 6 2 3 5 0 ]
bind 0 "setweapon FI"
bind 1 "setweapon SG"
bind 2 "setweapon CG"
bind 3 "setweapon RL"
bind 4 "setweapon RI"
bind 5 "setweapon GL"
bind 6 "setweapon PI"
bind 7 "setweapon FI"
specbind MOUSE1 "nextfollow"
specbind SPACE "follow"

bind F11 "toggleconsole"
bind C "thirdperson (! $thirdperson)"

hudgun 1

showfps 0
hudscore 0
gameclock 0
