// game_fps.cfg — version portfolio : un seul modèle de joueur (avatar maison)

modenames = "ffa coop"
mapcomplete = [ complete $arg1 packages/base ogz ]
mapcomplete map

allowedittoggle = [ result 0 ]

// addplayermodel <ffa> <bleu> <rouge> <icône>
addplayermodel "pfavatar" "pfavatar/blue" "pfavatar/red" ""
playermodelnum = 1
playermodeldir0 = "pfavatar"
playermodelicon0 = "pfavatar"
playermodelname0 = "Visiteur"
playermodelstory0 = [Un visiteur curieux du portfolio.]
playermodelname = [result $playermodelname0]
playermodelicon = [result $playermodelicon0]
