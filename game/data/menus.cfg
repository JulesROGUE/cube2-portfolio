// menus.cfg — menus de la visite portfolio (système de menus d'origine de Cube 2)

togglemainmenu = [ || (cleargui 1) [showgui main] ]
bind ESCAPE [togglemainmenu]

newgui main [
    newname = (getname)
    guilist [ guitext "pseudo: "; guifield newname 15 [name $newname] ]
    guibar
    guibutton "reprendre"              [cleargui]
    guibutton "options.."              [showgui options]
    guibutton "recommencer l'histoire" [pfrestart; cleargui]
    if (isconnected 0 0) [] [ guibutton "rejoindre le serveur" [pfconnect] ]
    guibar
    guitext "ZQSD/WASD, souris, Espace, 1-6 : armes, T : chat, Tab : scores"
] 0

newgui options [
    guitext "sensibilite de la souris"
    guislider sensitivity 1 20
    guitext "champ de vision"
    guislider fov 70 120
    guitext "volume"
    guislider soundvol 0 255
    guicheckbox "inverser la souris" invmouse
    guicheckbox "vue a la troisieme personne" thirdperson
    guicheckbox "arme visible" hudgun
]
