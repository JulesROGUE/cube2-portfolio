// menus.cfg — menus minimalistes de la visite portfolio

togglemainmenu = [ || (cleargui 1) [showgui main] ]
bind ESCAPE [togglemainmenu]

newgui main [
    guitext "^f2Visite du portfolio de Jules ROGUE"
    guibar
    newname = (getname)
    guilist [ guitext "Pseudo : "; guifield newname 15 [name $newname] ]
    guibar
    guibutton "Reprendre la visite"      [cleargui]
    guibutton "Aide / commandes"         [showgui aide]
    guibutton "Recommencer l'histoire"   [pfrestart; cleargui]
    guibutton "Options"                  [showgui options]
    guibar
    if (isconnected 0 0) [
        guitext "^f0Connecté au serveur multijoueur"
    ] [
        guitext "^f3Hors ligne (visite en solo)"
        guibutton "Se connecter au serveur" [pfconnect]
    ]
] 0

newgui aide [
    guitext "^f2Commandes"
    guitext "ZQSD / WASD / flèches : se déplacer"
    guitext "Souris : regarder (cliquer pour capturer la souris)"
    guitext "Espace : sauter"
    guitext "T ou Entrée : discuter avec les autres visiteurs"
    guitext "Tab : liste des joueurs connectés"
    guitext "C : vue à la troisième personne"
    guitext "Échap : menu"
    guibar
    guitext "^f2But"
    guitext "Visite chaque salle pour découvrir le parcours de Jules."
    guitext "Le compteur en haut à droite suit ta progression."
]

newgui options [
    guitext "Sensibilité de la souris"
    guislider sensitivity 1 20
    guitext "Champ de vision"
    guislider fov 70 120
    guicheckbox "Inverser la souris" invmouse
    guicheckbox "Panneaux de la visite" pfhud
    guicheckbox "Vue à la troisième personne" thirdperson
]
