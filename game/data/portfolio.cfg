// portfolio.cfg — réglages propres à la visite, exécutés par la coquille web après
// les scripts d'origine de Sauerbraten (data/*.cfg, inchangés).

// Modèles de joueur (liste d'origine, comme le client de bureau) :
//   ffa, bleu, rouge, armes 1re personne, vwep, quad, 3 armures, icône, ragdoll
// Apparences des visiteurs (modèles du jeu de base dont la licence permet la
// redistribution, voir CREDITS.md ; Ogro, sans licence explicite, est écarté).
// Les armes à la 1re personne de Mr. Fixit servent à tous (fichiers plus légers).
addplayermodel "mrfixit" "mrfixit/blue" "mrfixit/red" "mrfixit/hudguns" "" "mrfixit/horns" "mrfixit/armor/blue" "mrfixit/armor/green" "mrfixit/armor/yellow" "mrfixit" 1
addplayermodel "snoutx10k" "snoutx10k/blue" "snoutx10k/red" "mrfixit/hudguns" "" "snoutx10k/wings" "snoutx10k/armor/blue" "snoutx10k/armor/green" "snoutx10k/armor/yellow" "snoutx10k" 1
addplayermodel "inky" "inky/blue" "inky/red" "mrfixit/hudguns" "" "inky/quad" "inky/armor/blue" "inky/armor/green" "inky/armor/yellow" "inky" 1
addplayermodel "captaincannon" "captaincannon/blue" "captaincannon/red" "mrfixit/hudguns" "" "captaincannon/quad" "captaincannon/armor/blue" "captaincannon/armor/green" "captaincannon/armor/yellow" "captaincannon" 1
// Monstres de la visite (bots) : modèles des monstres du mode solo d'origine.
// L'ordre correspond aux cris d'origine choisis dans fpsgame/fps.cpp.
addplayermodel "monster/rat" "" "" "" "" "" "" "" "" "" 0
addplayermodel "monster/slith" "" "" "" "" "" "" "" "" "" 0
addplayermodel "monster/bauul" "" "" "" "" "" "" "" "" "" 0
addplayermodel "monster/hellpig" "" "" "" "" "" "" "" "" "" 0

// Pas d'édition de carte dans la visite.
allowedittoggle = [ result 0 ]

// Menus d'origine : les listes de cartes officielles (non embarquées) sont remplacées
// par la seule carte de la visite, pour que les menus de vote n'affichent pas de
// vignettes manquantes.
ffamaps1 = "portfolio"
loop i 10 [ [ffamaps@(+ $i 2)] = "" ]
loop i 7 [ [capturemaps@(+ $i 1)] = ""; [ctfmaps@(+ $i 1)] = "" ]
conceptmaps = ""
spmaps = ""
rpgmaps = ""
allffamaps = "portfolio"
allcapturemaps = ""
allctfmaps = ""
allmaps = "portfolio"

// Clavier AZERTY : ZQSD (les flèches restent liées, comme à l'origine). Cube 2 reçoit
// le caractère de la touche (keyCode du navigateur), donc Z = la touche Z d'un AZERTY.
bind Z forward
bind Q left
bind S backward
bind D right
bind W ""
bind A ""

// Musique : celle du jeu de base (packages/fanatic) n'est pas embarquée ; la coquille web
// joue les morceaux libres de droit (CC0) chargés à la demande.
playsong = []

// --- Apparence : liste d'origine (data/game_fps.cfg) réduite aux modèles embarqués ---
playermodelnum = 4
playermodeldir2 = "inky"
playermodelicon2 = "inky"
playermodelname2 = "Inky"
playermodelstory2 = $playermodelstory3
playermodeldir3 = "captaincannon"
playermodelicon3 = "captaincannon"
playermodelname3 = "Captain Cannon"
playermodelstory3 = $playermodelstory4
// (menu d'origine `playermodel` ; le choix est mémorisé par la coquille web dans
// localStorage et envoyé au serveur, donc vu des autres joueurs)

// Libellés des menus en anglais, comme le reste de l'interface d'origine du jeu.
// --- Menu principal minimal (remplace celui d'origine : ni navigateur de serveurs,
//     ni vote de mode/carte, ni master, ni déconnexion, ni changement de pseudo) ---
newgui main [
    guilist [
        guiimage (concatword "packages/icons/" (playermodelicon) ".jpg") [chooseplayermodel] 1.15
        guistrut 0.25
        guilist [
            guitext (getname) 0
            guitext "Jules ROGUE's portfolio tour" 0
            guispring
            guibutton (playermodelname) [chooseplayermodel] 0
        ]
    ]
    guibar
    guibutton "Resume" [cleargui] "action"
    guibutton "Respawn (R)" [pfrespawn] "arrow_bw"
    guibutton (if (isspectator (getclientnum)) [result "Stop spectating"] [result "Spectator"]) [pfspectate] "spectator"
    guibutton "Appearance.." [chooseplayermodel] "hand"
    guibutton "Fullscreen (F)" [js fullscreen] "menu"
    guibutton "Options.." "showgui options" "info"
    guibutton "About.." "showgui about" "info"
    guibar
    guibutton "Quit game" "showgui Quit" "exit"
] 0

newgui Quit [
    guitext "Quit the tour?" 0
    guibar
    guibutton "yes" [js quit] "exit"
    guibutton "no" [cleargui 1] "action"
]

// Plein écran (F11 est réservé au navigateur et à la console d'origine)
bind F [js fullscreen]

// --- Secours et spectateur ------------------------------------------------------
// R / « Respawn » : réapparition immédiate sur un départ de la place d'accueil (même
// si l'on est coincé ou mort ; quitte aussi le mode spectateur).
pfrespawn = [
    cleargui
    if (isspectator (getclientnum)) [spectator 0] [suicide]
    sleep 300 [respawn]
]
bind R [pfrespawn]
// Spectateur : vol libre (commande d'origine `spectator`, autorisée pour soi sur le serveur)
pfspectate = [
    cleargui
    if (isspectator (getclientnum)) [spectator 0; sleep 300 [respawn]] [spectator 1]
]
