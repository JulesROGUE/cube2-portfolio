// ui.cfg - interface de la visite (système d'interface de Tesseract).
// Boutons en anglais (demande de Jules) ; pas d'éditeur, de navigateur de serveurs,
// de vote, de master ni de changement de pseudo.

exec "config/ui/lib.cfg"           // bibliothèque d'interface de Tesseract
exec "config/ui/style.cfg"         // styles
exec "config/ui/options.cfg"       // options de Tesseract (affichage, son, souris...)

reui = [ exec "config/ui.cfg" ]

togglemainmenu = [|| hidetopui [toggleui main]]
bind ESCAPE [togglemainmenu]

// --- Menu principal ---------------------------------------------------------------
UImenu "main" [
    uivlist 0.004 [
        uitext (getname) 0.7
        uitext "^f4Jules ROGUE's portfolio tour" 0.55
        uifill 0.26 0.012 [UIbar 1]
        UIbutton "hold2" [uitext "Resume" 0.65] 0.26 0.04 [hideallui]
        UIbutton "hold2" [uitext "Respawn (R)" 0.65] 0.26 0.04 [pfrespawn]
        UIbutton "hold2" [uitext (? (isspectator (getclientnum)) "Stop spectating" "Spectator") 0.65] 0.26 0.04 [pfspectate]
        UIbutton "hold2" [uitext "Appearance.." 0.65] 0.26 0.04 [hideui main; showui appearance]
        UIbutton "hold2" [uitext "Fullscreen (F)" 0.65] 0.26 0.04 [js fullscreen]
        UIbutton "hold2" [uitext "Options.." 0.65] 0.26 0.04 [hideui main; showui options]
        UIbutton "hold2" [uitext "About.." 0.65] 0.26 0.04 [hideui main; showui about]
        uifill 0.26 0.012 [UIbar 1]
        UIbutton "hold2" [uitext "Quit game" 0.65] 0.26 0.04 [hideui main; showui Quit]
    ]
]

// --- Quitter (confirmation) ----------------------------------------------------------
UImenu "Quit" [
    uivlist 0.006 [
        uitext "Quit the tour?" 0.7
        uifill 0.2 0.01 [UIbar 1]
        UIbutton "hold2" [uitext "yes" 0.65] 0.2 0.04 [js quit]
        UIbutton "hold2" [uitext "no" 0.65] 0.2 0.04 [hideui Quit; showui main]
    ]
]

// --- Apparence : modèles de joueur de Sauerbraten embarqués ---------------------
UI_pmodel = 0
UImenu "appearance" [
    UI_pmodel = $playermodel
    uihlist 0.01 [
        uivlist 0.004 [
            loop i $playermodelnum [
                UIbutton "hold2" [
                    UIradio [= $playermodel @i] 0.016
                    uitext (playermodelname @i) 0.6
                ] 0.24 0.036 [playermodel @i] -1
            ]
        ]
        uiplayerpreview $playermodel 0 0 1 0.3 0.4 [
            style_generic_default
        ]
    ]
] [] [] [] "Appearance"

// --- À propos ---------------------------------------------------------------------
UImenu "about" [
    uivlist 0.004 [
        uitext "Jules ROGUE's portfolio tour" 0.7
        uitext "Cube 2: Sauerbraten game on the Tesseract engine" 0.55
        uitext "Engine: Tesseract (zlib) - game assets: Sauerbraten" 0.5
        uitext "See CREDITS.md in the github.com/JulesROGUE/cube2-portfolio repository" 0.5
    ]
] [] [] [] "About"

// --- Tableau des scores (touche Tab) -------------------------------------------------
newui "scoreboard" [
    uicolor 0x80101010 0 0 [
        uispace 0.015 0.012 [
            uivlist 0.004 [
                uitext (concatword "^f2Jules ROGUE's portfolio tour ^f7- " (pffound) "/" (pftotal) " fragments") 0.6
                uifill 0.4 0.01 [UIbar 1]
                uigrid 3 0.03 0.002 [
                    uitext "^f4Name" 0.55 ; uitext "^f4Frags" 0.55 ; uitext "^f4Ping" 0.55
                    loopscoreboard cn [
                        uitext (getclientcolorname $cn) 0.55
                        uitext (getclientfrags $cn) 0.55
                        uitext (getclientping $cn) 0.55
                    ]
                ]
            ]
        ]
    ]
]
